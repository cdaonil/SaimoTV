plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saimo.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.saimo.tv"
        minSdk 21          // Android 5.0+ (Mi TV Stick usa Android TV 9)
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave de debug para instalar direto no Mi Stick
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
